const items=[...nav.children];const panel=document.getElementById('panel');function update(){imgs.forEach((s,i)=>{s.classList.toggle('active',i===current);s.classList.toggle('past',i<current);s.setAttribute('aria-hidden',i!==current)});items.forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'step':'false')});items[current].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});document.getElementById('fill').style.width=`${(current+1)/data.length*100}%`;document.getElementById('count').textContent=`${String(current+1).padStart(2,'0')} / ${String(data.length).padStart(2,'0')}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===data.length-1;document.title=`${data[current][0]} | 하천·계곡 정비`;if(panel.classList.contains('open'))fillPanel();history.replaceState(null,'',`#slide-${current+1}`)}function go(n){n=Math.max(0,Math.min(data.length-1,n));if(n===current)return;current=n;update()}function fillPanel(){const d=data[current];document.getElementById('panel-number').textContent=`RIVER / FIELD NOTES   ${String(current+1).padStart(2,'0')}`;document.getElementById('panel-title').textContent=d[0];document.getElementById('panel-sub').textContent=d[1];document.getElementById('panel-list').replaceChildren(...d[2].map(v=>{let li=document.createElement('li');li.textContent=v;return li}))}function openPanel(){fillPanel();panel.classList.add('open');document.getElementById('info').setAttribute('aria-expanded','true')}function closePanel(){panel.classList.remove('open');document.getElementById('info').setAttribute('aria-expanded','false')}document.getElementById('info').onclick=()=>panel.classList.contains('open')?closePanel():openPanel();document.getElementById('close').onclick=closePanel;document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('progress').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.min(data.length-1,Math.floor((e.clientX-r.left)/r.width*data.length)))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();return}if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(data.length-1);if(e.key==='i'||e.key==='I')panel.classList.contains('open')?closePanel():openPanel()});viewer.addEventListener('wheel',e=>{if(panel.classList.contains('open'))return;e.preventDefault();const now=Date.now();if(now-wheelTimer>700)wheelSum=0;wheelTimer=now;wheelSum+=e.deltaY;if(Math.abs(wheelSum)>70&&!locked){go(current+(wheelSum>0?1:-1));wheelSum=0;locked=true;setTimeout(()=>locked=false,550)}},{passive:false});viewer.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;const dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))>45)go(current + ((Math.abs(dx)>Math.abs(dy)?dx:dy)<0 ? 1 : -1))},{passive:true});const initial=Number((location.hash.match(/slide-(\d+)/)||[])[1]);if(initial>=1&&initial<=data.length)current=initial-1;update();setTimeout(()=>document.getElementById('help').classList.add('hidden'),4200);window.addEventListener('hashchange',()=>{const k=Number((location.hash.match(/slide-(\d+)/)||[])[1]);if(k>=1&&k<=data.length)go(k-1)});
